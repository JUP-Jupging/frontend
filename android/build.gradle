buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// ✅ 혹시 하위 모듈이 예전 GMS를 끌어오면 v21+로 강제
subprojects { sub ->
    sub.configurations.all { cfg ->
        cfg.resolutionStrategy.eachDependency { d ->
            if (d.requested.group == 'com.google.android.gms'
                && d.requested.name == 'play-services-location') {
                d.useVersion '21.3.0'
            }
        }
    }
}
